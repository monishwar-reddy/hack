[build]
  command = "npm run build --workspace frontend"
  publish = "apps/frontend/.next"
  base = "."

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["apps/frontend/public/**"]
  external_node_modules = ["@copilotkit/runtime", "express"]
